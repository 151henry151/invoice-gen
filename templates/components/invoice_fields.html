{# Invoice Fields Component #}
<div class="invoice-fields row">
  <div class="form-group col-md-4">
    <label for="date">Invoice Date:</label>
    <input type="date" id="date" name="date" class="form-control" required value="{{ today_str|default('') }}">
  </div>
  <div class="form-group col-md-4">
    <label for="due_date">Due Date:</label>
    <input type="date" id="due_date" name="due_date" class="form-control" required>
  </div>
  <div class="form-group col-md-4 invoice-number-group">
    <label for="invoice_number" class="w-100">Invoice Number:</label>
    <input type="text"
           id="invoice_number"
           name="invoice_number"
           class="form-control"
           value="{{ assigned_invoice_number|default('') }}"
           readonly
           required
           aria-readonly="true"
           title="Assigned automatically">
    <div class="form-text">Assigned automatically; not editable.</div>
  </div>
</div>

<style>
.invoice-fields {
  margin-bottom: 20px;
}
.invoice-number-group input[readonly] {
  background-color: var(--bs-secondary-bg, #e9ecef);
  cursor: default;
}
</style>
